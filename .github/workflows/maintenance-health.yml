name: Repository health

on:
  schedule:
    - cron: "43 7 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify scheduled maintenance environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: maintenance
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: https://kleinpanic.github.io
          SITE_BASE_PATH: /fdm-material-atlas/

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reject known high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify dependency trust policy
        run: npm run audit:dependencies

      - name: Verify source, data, tests, and workflow contracts
        run: npm run ci:quality && npm run test:ci-contracts

      - name: Verify both static deployment modes and routes
        run: npm run build:test-modes && npm run validate:html && npm run validate:routes

      - name: Probe the deployed site
        run: node tools/probe-pages.mjs
        env:
          DEPLOYED_PAGE_URL: https://kleinpanic.github.io/fdm-material-atlas/

  report:
    if: always()
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Maintain one actionable health issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEALTH_RESULT: ${{ needs.health.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[automation] Repository health needs attention"
          issue_number="$(gh issue list --state open --search 'Repository health needs attention in:title author:app/github-actions' --json number --jq '.[0].number // empty')"
          if [ "$HEALTH_RESULT" = "success" ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --comment "The scheduled health check recovered: $RUN_URL"
            fi
          else
            body="The scheduled repository health check failed. No release or dependency change was applied automatically. Inspect the failing run: $RUN_URL"
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi
