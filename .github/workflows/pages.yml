name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: read
    outputs:
      origin: ${{ steps.pages.outputs.origin }}
      base-path: ${{ steps.pages.outputs.base_path }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Validate trusted release environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: pages
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Install reviewed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit direct dependencies
        run: npm run audit:dependencies
      - name: Install lockfile-controlled Chromium
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run source quality and workflow contract gates
        run: npm run ci:quality && npm run test:ci-contracts
      - name: Build the one Pages artifact
        run: npm exec --no -- astro build --outDir dist-pages
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Test the exact Pages artifact
        run: ATLAS_TEST_MODE=pages npm run verify:exact-artifact
        env:
          ATLAS_PAGES_ARTIFACT: dist-pages
          ATLAS_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          ATLAS_PAGES_BASE: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Upload the tested Pages artifact once
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  deploy:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: deployment
        name: Deploy the tested artifact
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  probe:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Probe the deployed Pages site
        run: node tools/probe-pages.mjs
        env:
          DEPLOYED_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
