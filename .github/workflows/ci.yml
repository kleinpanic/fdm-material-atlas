name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify controlled CI environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: ci
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: https://atlas.example
          SITE_BASE_PATH: /

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify direct dependency policy
        run: npm run audit:dependencies

      - name: Run format, lint, type, data, unit, and integration gates
        run: npm run ci:quality

      - name: Run CI contract tests
        run: npm run test:ci-contracts

      - name: Verify dependency installation did not alter the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Append bounded public data change summary
        if: github.event_name == 'pull_request'
        run: |
          if ! printf '%s' "$PR_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            printf '%s\n' 'CI_BASE_SHA_INVALID' >&2
            exit 1
          fi
          git cat-file -e "$PR_BASE_SHA^{commit}"
          npm run summarize:data-change -- --base-ref "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  build:
    needs: quality
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify controlled CI environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: ci
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: https://atlas.example
          SITE_BASE_PATH: /

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build both deployment modes
        run: npm run build:test-modes

      - name: Validate emitted HTML and internal references
        run: npm run validate:html

      - name: Validate final route inventory and generic privacy policy
        run: npm run validate:routes

      - name: Verify dependency installation did not alter the lockfile
        run: git diff --exit-code -- package-lock.json

  browser:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify controlled CI environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: ci
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: https://atlas.example
          SITE_BASE_PATH: /

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify direct dependency policy before browser installation
        run: npm run audit:dependencies

      - name: Install reviewed Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Build both deployment modes for browser verification
        run: npm run build:test-modes

      - name: Run release-critical browser journeys in both deployment modes
        run: npm run test:release-browser

      - name: Run axe and explicit accessibility gates in both modes
        run: npm run test:accessibility

      - name: Verify dependency installation did not alter the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Check failure diagnostic bounds
        id: diagnostic_bounds
        if: failure()
        run: |
          test -d test-results
          test -z "$(find test-results -type l -print -quit)"
          test "$(find test-results -type f -printf . | wc -c)" -le 200
          test "$(du -sk test-results | cut -f1)" -le 20480

      - name: Retain bounded browser diagnostics on failure
        if: failure() && steps.diagnostic_bounds.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 3

  performance:
    needs: browser
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify controlled CI environment
        run: node tools/verify-ci-environment.mjs
        env:
          CI_CONTEXT: ci
          CI_NODE_VERSION: 22.23.1
          CI_NPM_VERSION: 10.9.8
          CI_LOCKFILE_STATE: clean
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ORIGIN: https://atlas.example
          SITE_BASE_PATH: /

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify direct dependency policy before browser installation
        run: npm run audit:dependencies

      - name: Install reviewed Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Build both deployment modes for performance measurement
        run: npm run build:test-modes

      - name: Run local performance budgets
        run: npm run test:performance

      - name: Verify dependency installation did not alter the lockfile
        run: git diff --exit-code -- package-lock.json
